# OpenViking — self-evolving context database for AI agents.
# https://github.com/volcengine/OpenViking
#
# Standalone: the vector DB backend is `local` (file-based) and QueueFS is
# sqlite, so this instance needs neither shared Postgres nor Valkey.
#
# All persistent state — ov.conf, ovcli.conf and the workspace — lives under
# /app/.openviking, so one bind mount covers everything.

name: openviking

services:
  openviking:
    image: ghcr.io/volcengine/openviking:${OPENVIKING_VERSION:-latest}
    container_name: openviking
    restart: "no"

    # Loopback only — reachable from other peers as https://openviking.dev.internal
    # through the Caddy proxy in devdns/.
    ports:
      - "127.0.0.1:${OPENVIKING_PORT:-1933}:1933"

    volumes:
      - ./data:/app/.openviking

    environment:
      # Referenced as ${VAR} from data/ov.conf — OpenViking expands environment
      # variables when it reads the config, so no secret is ever committed.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in openviking/.env}
      OPENVIKING_ROOT_API_KEY: ${OPENVIKING_ROOT_API_KEY:?set OPENVIKING_ROOT_API_KEY in openviking/.env}
      OV_VLM_MODEL: ${OV_VLM_MODEL:-gemini/gemini-2.5-flash}

      OPENVIKING_SERVER_PORT: 1933
      OPENVIKING_PUBLIC_BASE_URL: ${OPENVIKING_PUBLIC_BASE_URL:-https://openviking.dev.internal}

    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    networks:
      - devnet

networks:
  devnet:
    external: true
    name: ${DEV_NETWORK:-devnet}
